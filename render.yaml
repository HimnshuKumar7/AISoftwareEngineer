# Render Blueprint: backend only. The React frontend is deployed on Vercel (see frontend/vercel.json).
# Dashboard -> New -> Blueprint -> select this repository. Fill every `sync: false` value when prompted.
services:
  - type: web
    name: ai-software-engineer-api-docker
    runtime: docker                  # Docker guarantees `git` is present for repository cloning
    plan: free                       # 512 MB RAM. Upgrade to "starter" if indexing large repos OOMs.
    region: ohio                  # choose the region closest to your Neon project
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL            # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: JWT_SECRET              # generated by Render, >= 32 chars
        generateValue: true
      - key: CORS_ORIGINS            # your Vercel production URL, e.g. https://my-app.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX       # optional: Vercel previews, e.g. https://my-app-.*\.vercel\.app
        sync: false
      - key: LLM_PROVIDER            # ollama | groq | gemini | openai
        value: groq
      - key: LLM_MODEL               # optional override of the provider default
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL         # only if you host Ollama somewhere publicly reachable
        sync: false
      - key: MODEL_CACHE_DIR
        value: /app/models           # MiniLM weights are baked into the image at build time
      - key: DATA_DIR
        value: /tmp/ai-software-engineer
      - key: LOG_LEVEL
        value: INFO
